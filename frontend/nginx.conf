# ==========================================
# MOONFIT FRONTEND & REVERSE PROXY - NGINX
# ==========================================
# Ubicación típica en VPS: /etc/nginx/sites-available/moonfit
# Enlace simbólico: ln -s /etc/nginx/sites-available/moonfit /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name app.tudominio.com api.tudominio.com;

    # Redirigir todo el tráfico HTTP a HTTPS de forma automática
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.tudominio.com;

    # Certificados SSL (Generados con Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/app.tudominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.tudominio.com/privkey.pem;

    # Ruta a la carpeta dist compilada de Vite
    root /var/www/moonfit/frontend/dist;
    index index.html;

    # Tamaño máximo de subida para fotos (Progreso, Comidas, Avatar)
    client_max_body_size 10M;

    # 1. Compresión Gzip balanceada (Nivel 5: excelente compresión con bajo consumo de CPU)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 2. Caché inmutable para JS/CSS versionados de Vite (Ahorro de ~90% de ancho de banda)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 3. Enrutamiento SPA (React 19)
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-cache";
    }

    # 4. Proxy Inverso para la API Backend (Node.js en puerto 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
